name: Publish OpenTelemetry capability report

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: otel-report-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
      - name: Check report renderer
        run: |
          node --check report/report/web/app.js
          bazel test --config=local //report:report_test //report:assemble_test
      - name: Verify standalone telemetry labs
        run: |
          bazel test --config=local --nocache_test_results \
            //harness:telemetry_lab_claims_test \
            //fixtures:telemetry_lab_suite
      - name: Run fresh receipt-producing tests
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          OTEL_TEST_REVISION="${revision}" bazel test \
            --config=local \
            --nocache_test_results \
            --test_env=OTEL_TEST_REVISION \
            --build_event_json_file=otel-profile.bep.json \
            --nobuild_event_json_file_path_conversion \
            --remote_download_outputs=toplevel \
            //fixtures:otel_report_suite \
            //fixtures:telemetry_lab_suite
      - name: Assemble the report from accepted receipts
        shell: bash
        run: |
          set -euo pipefail
          REPORT_BAZEL_CONFIG=local \
            REPORT_REPOSITORY="${GITHUB_REPOSITORY}" \
            REPORT_REVISION="$(git rev-parse HEAD)" \
            tools/assemble_otel_report.sh
          mkdir -p _site
          cp feature-parity-report.html _site/index.html
          cp feature-parity-report.html _site/feature-parity-report.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
