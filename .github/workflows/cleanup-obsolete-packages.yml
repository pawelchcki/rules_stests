name: Remove obsolete fixture packages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-obsolete-packages.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete superseded per-app packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response_path="${RUNNER_TEMP}/package-delete-response.json"
          for package_name in \
            rules-stests-aiohttp \
            rules-stests-django-ninja \
            rules-stests-fastapi-realworld; do
            status="$(curl --silent --show-error --location \
              --output "${response_path}" --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/users/pawelchcki/packages/container/${package_name}")"
            case "${status}" in
              204)
                echo "Deleted ${package_name}."
                ;;
              404)
                echo "${package_name} is already absent."
                ;;
              *)
                echo "Failed to delete ${package_name}: HTTP ${status}" >&2
                jq -r '.message // .' "${response_path}" >&2
                exit 1
                ;;
            esac
          done
