name: OpenTelemetry proof report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true

      - name: Run all 39 profile scenarios without cached test results
        env:
          OTEL_TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bazel test \
            --nocache_test_results \
            --test_env=OTEL_TEST_REVISION \
            --build_event_json_file=otel-profile.bep.json \
            --nobuild_event_json_file_path_conversion \
            //bazel/itest/apps:aiohttp_otel_hurl_test \
            //bazel/itest/apps:django_otel_hurl_test \
            //bazel/itest/apps:gin_otel_contract_test

      - name: Assemble the receipt-backed report
        env:
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: tools/assemble_otel_report.sh

      - name: Publish report and proof artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opentelemetry-proof-report
          path: |
            feature-parity-report.html
            otel-profile.bep.json
            bazel-testlogs/**/test.outputs/**
            bazel-testlogs/**/*outputs.zip
          if-no-files-found: error
