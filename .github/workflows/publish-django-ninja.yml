name: Publish Django Ninja RealWorld fixture

on:
  push:
    branches: [main]
    paths:
      - realworld_corpus/apps/python/realworld-django-ninja/**
      - bazel/**
      - MODULE.bazel
      - MODULE.bazel.lock
      - tools/update_oci_lock.py
      - .github/workflows/publish-django-ninja.yml
  workflow_dispatch:

concurrency:
  group: publish-django-ninja
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  APP_PATH: realworld_corpus/apps/python/realworld-django-ninja
  IMAGE: ghcr.io/pawelchcki/rules_stest_apps
  LOCK_NAME: django_ninja_realworld
  REF_NAME: django-ninja

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true

      - name: Compute content identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tree_oid="$(git rev-parse "HEAD:${APP_PATH}")"
          version="v0.${GITHUB_RUN_NUMBER}"
          echo "tree=${tree_oid}" >>"${GITHUB_OUTPUT}"
          echo "tree_tag=${REF_NAME}-tree-${tree_oid}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "version_tag=${REF_NAME}-${version}" >>"${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find an existing content-addressed image
        id: existing
        env:
          TREE_TAG: ${{ steps.identity.outputs.tree_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if inspection="$(docker buildx imagetools inspect "${IMAGE}:${TREE_TAG}" 2>/dev/null)"; then
            digest="$(printf '%s\n' "${inspection}" | awk '$1 == "Digest:" { print $2; exit }')"
            test "${digest#sha256:}" != "${digest}"
            echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          fi

      - name: Build and push the single-layer image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.APP_PATH }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          build-args: SOURCE_DATE_EPOCH=0
          outputs: type=image,push=true,rewrite-timestamp=true,oci-mediatypes=true,compression=gzip,force-compression=true
          tags: |
            ${{ env.IMAGE }}:${{ steps.identity.outputs.tree_tag }}
            ${{ env.IMAGE }}:${{ steps.identity.outputs.version_tag }}

      - name: Resolve the immutable digest and release tag
        id: release
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          VERSION_TAG: ${{ steps.identity.outputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-${BUILD_DIGEST}}"
          test "${digest#sha256:}" != "${digest}"
          if [[ -n "${EXISTING_DIGEST}" ]]; then
            docker buildx imagetools create --tag "${IMAGE}:${VERSION_TAG}" "${IMAGE}@${digest}"
          fi
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Publish the source-tree ref
        # Vendored app trees may themselves contain .github/workflows. GitHub's
        # installation token can reject such refs; image verification and the
        # digest lock must still proceed, and a workflow-scoped user token can
        # push the deterministic ref without changing its object ID.
        continue-on-error: true
        env:
          TREE_OID: ${{ steps.identity.outputs.tree }}
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          commit_oid="$(printf 'OCI source tree %s\n' "${TREE_OID}" | env \
            GIT_AUTHOR_NAME=rules-stests GIT_AUTHOR_EMAIL=rules-stests@users.noreply.github.com \
            GIT_COMMITTER_NAME=rules-stests GIT_COMMITTER_EMAIL=rules-stests@users.noreply.github.com \
            GIT_AUTHOR_DATE=1970-01-01T00:00:00Z GIT_COMMITTER_DATE=1970-01-01T00:00:00Z \
            git commit-tree "${TREE_OID}")"
          git update-ref "refs/tags/oci/${REF_NAME}/${VERSION}" "${commit_oid}"
          git push origin "refs/tags/oci/${REF_NAME}/${VERSION}"

      - name: Verify anonymous pull
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker pull "${IMAGE}@${DIGEST}"
          payload_layers="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw | jq '[.layers[] | select(.size > 1024)] | length')"
          test "${payload_layers}" = 1

      - name: Validate and propose the digest lock
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TREE_OID: ${{ steps.identity.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/update_oci_lock.py --name "${LOCK_NAME}" --digest "${DIGEST}" --tree "${TREE_OID}"
          bazel test //bazel/itest/apps:django_test //bazel/itest/apps:django_hurl_test
          if git diff --quiet -- MODULE.bazel.lock bazel/oci_images.lock.bzl; then
            echo "Digest lock is already current."
            exit 0
          fi
          branch="automation/oci-lock-${REF_NAME}-${TREE_OID:0:12}-${DIGEST:7:12}"
          git switch -c "${branch}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MODULE.bazel.lock bazel/oci_images.lock.bzl
          git commit -m "chore: lock ${REF_NAME} OCI digest"
          git push origin "HEAD:refs/heads/${branch}"
          if ! gh pr create --base main --head "${branch}" \
              --title "chore: lock ${REF_NAME} OCI digest" \
              --body "Locks ${IMAGE}@${DIGEST} for app tree ${TREE_OID}. The workflow verified an anonymous pull and the rules_itest smoke test."; then
            echo "::warning::The validated lock branch ${branch} was pushed, but repository settings prevent Actions from creating its pull request."
          fi
