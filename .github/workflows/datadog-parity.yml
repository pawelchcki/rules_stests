name: Datadog parity evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
      - name: Validate pinned Datadog reference twice
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          bazel test --config=local //fixtures:datadog_suite --test_env="TELEMETRY_TEST_REVISION=${REVISION}" --remote_download_outputs=all --nocache_test_results
          bazel test --config=local //fixtures:datadog_suite --test_env="TELEMETRY_TEST_REVISION=${REVISION}" --remote_download_outputs=all --nocache_test_results
          args=(--revision "${REVISION}")
          for manifest in bazel-bin/corpus/python-{aiohttp,django}-datadog-v4-14-0-{v04,v05}.profile.json; do
            args+=(--manifest "${PWD}/${manifest}")
          done
          while IFS= read -r receipt; do args+=(--receipt "${PWD}/${receipt}"); done < <(find -L bazel-testlogs/fixtures -path '*/test.outputs/datadog/receipts/*.json' ! -name '*.capture.json' -type f | sort)
          bazel run --config=local //tools/datadog_coverage:datadog_coverage -- "${args[@]}"
      - name: Shared OTel regressions
        run: bazel test --config=local //report:report_test //harness:hurl_test_driver_test //harness:otel_sink_test
      - name: External reference-profile consumers
        working-directory: examples/plugin_agent
        run: |
          bazel build --config=local //:telemetry_api_check
          bazel test --config=local //:example_datadog_hurl_test //:example_django_datadog_hurl_test //:datadog_consumer_identity_test
