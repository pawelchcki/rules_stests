name: Datadog parity evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: bazel-contrib/setup-bazel@8cb04a772ab4c1eb984e9c1b493a182e96c5e425 # 0.19.0
        with:
          bazelisk-cache: true
      - name: Build reviewed local Datadog images
        run: tools/build_datadog_fixtures.sh "${RUNNER_TEMP}/datadog-images"
      - name: Validate and retain each independent execution
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t image_flags < "${RUNNER_TEMP}/datadog-images/bazel.flags"
          bazel build --config=local --jobs=4 "${image_flags[@]}" //tools/datadog_coverage:datadog_coverage
          for execution in 1 2; do
            bazel test --config=local --jobs=4 --local_test_jobs=4 "${image_flags[@]}" //fixtures:datadog_suite --test_env="TELEMETRY_TEST_REVISION=${REVISION}" --nocache_test_results
            tools/retain_datadog_evidence.py --revision "${REVISION}" --output "evidence/execution-${execution}" --gate bazel-bin/tools/datadog_coverage/datadog_coverage_/datadog_coverage
          done
      - name: Four-worker request isolation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t image_flags < "${RUNNER_TEMP}/datadog-images/bazel.flags"
          bazel test --config=local --jobs=4 --local_test_jobs=4 "${image_flags[@]}" //fixtures:datadog_parallel_suite --test_arg=--scenario-concurrency=4 --test_arg=--scenario-repetitions=1
          mkdir -p evidence/parallel
          find -L bazel-testlogs/fixtures -path '*/test.outputs/stress.*.json' -exec cp --parents '{}' evidence/parallel/ \;
      - name: Native feature and bootstrap checks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t image_flags < "${RUNNER_TEMP}/datadog-images/bazel.flags"
          bazel test --config=local --jobs=4 --local_test_jobs=4 "${image_flags[@]}" //fixtures:datadog_external_features_suite //harness:datadog_ruby_bootstrap_test //harness:datadog_sink_test //harness/external_features:probe_test //tools/datadog_coverage:datadog_coverage_test
          mkdir -p evidence/features
          find -L bazel-testlogs/fixtures -path '*datadog_external_features*/test.outputs/*' -type f -exec cp --parents '{}' evidence/features/ \;
      - name: Retain verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: datadog-evidence
          path: |
            evidence/
            bazel-testlogs/fixtures/**/test.log
            bazel-testlogs/fixtures/**/test.outputs/**
            ${{ runner.temp }}/datadog-images/*.build.log
          if-no-files-found: error
      - name: Shared OTel regressions
        run: bazel test --config=local --jobs=4 --local_test_jobs=4 //report:report_test //harness:hurl_test_driver_test //harness:otel_sink_test
      - name: External reference-profile consumers
        working-directory: examples/plugin_agent
        run: |
          bazel build --config=local //:telemetry_api_check
          bazel test --config=local //:example_datadog_hurl_test //:example_django_datadog_hurl_test //:datadog_consumer_identity_test
