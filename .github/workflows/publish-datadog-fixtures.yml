name: Publish reviewed Datadog fixtures

on:
  push:
    branches: [main]
    paths:
      - fixtures/agents/datadog-ruby/**
      - fixtures/apps/go/realworld-gin/**
      - fixtures/apps/ruby/realworld-falcon/**
      - tools/build_datadog_fixtures.sh
      - tools/local_oci_repository.py
      - tools/publish_datadog_fixtures.sh
      - .github/workflows/publish-datadog-fixtures.yml
  workflow_dispatch:

concurrency:
  group: publish-datadog-fixtures
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Build and validate the reviewed payloads
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo
          tools/build_datadog_fixtures.sh "$RUNNER_TEMP/datadog-images"
      - name: Publish and verify anonymous pulls
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/datadog-registry-auth.json
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f -- "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          tools/publish_datadog_fixtures.sh "$RUNNER_TEMP/datadog-images"
      - name: Propose the verified digest locks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bazel/oci_images.lock.bzl; then
            exit 0
          fi
          branch="automation/datadog-fixture-locks-${GITHUB_SHA:0:12}"
          body="$RUNNER_TEMP/datadog-lock-pr.md"
          printf '%s\n' 'Locks the three published Datadog fixtures after verifying their reviewed payload digests and anonymous pulls.' > "$body"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            if [[ -z "$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')" ]]; then
              gh pr create --base main --head "$branch" --title 'Publish Datadog fixture locks' --body-file "$body"
            fi
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bazel/oci_images.lock.bzl
          git commit -m 'Lock published Datadog fixture payloads'
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title 'Publish Datadog fixture locks' --body-file "$body"
