[project]
name = "fastapi-realworld-example-app"
version = "0.0.0"
description = "Backend logic implementation for https://github.com/gothinkster/realworld with awesome FastAPI"
authors = [{name = "Nik Sidnev", email = "sidnev.nick@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.9,<3.10"
dependencies = [
    "aiosql==6.2",
    "aiosqlite==0.20.0",
    "alembic==1.8.1",
    "bcrypt==3.2.0",
    "fastapi==0.79.1",
    "loguru==0.6.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic[email,dotenv]==1.9.2",
    "pyjwt==2.4.0",
    "pypika==0.48.9",
    "python-slugify==6.1.2",
    "sqlalchemy==1.4.31",
    "unidecode==1.3.4",
    "uvicorn==0.18.2",
]

[project.optional-dependencies]
postgres = [
    "asyncpg==0.26.0",
    "psycopg2-binary==2.9.3",
]
dev = [
    "asgi-lifespan==1.0.1",
    "httpx==0.23.0",
    "pytest==7.1.2",
    "pytest-asyncio==0.19.0",
    "pytest-cov==3.0.0",
    "pytest-env==0.6.2",
    "pytest-xdist==2.5.0",
]

[tool.isort]
profile = "black"
src_paths = ["app", "tests"]
combine_as_imports = true

[tool.pytest.ini_options]
testpaths = "tests"
filterwarnings = "error"
addopts = '''
  --strict-markers
  --tb=short
  --cov=app
  --cov=tests
  --cov-branch
  --cov-report=term-missing
  --cov-report=html
  --cov-report=xml
  --no-cov-on-fail
  --cov-fail-under=100
  --numprocesses=auto
  --asyncio-mode=auto
'''
env = [
  "SECRET_KEY=secret",
  "MAX_CONNECTIONS_COUNT=1",
  "MIN_CONNECTIONS_COUNT=1"
]

[build-system]
requires = ["setuptools==75.3.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
