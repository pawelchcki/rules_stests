[project]
name = "realworld-aiohttp"
version = "0.1.0"
description = "Hermetic aiohttp and asynchronous SQLite RealWorld backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp==3.13.2",
    "aiosqlite==0.21.0",
    "argon2-cffi==25.1.0",
    "pyjwt==2.10.1",
    "python-slugify==8.0.4",
    "sqlalchemy==2.0.44",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-aiohttp==1.1.0",
    "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
