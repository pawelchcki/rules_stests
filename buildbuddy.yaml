actions:
  - name: Full test suite
    visibility: PUBLIC
    container_image: ubuntu-24.04
    # Keep runner caches and installed tools across PR iterations.
    platform_properties:
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    resource_requests:
      # Bazel actions execute on the self-hosted RBE fleet. Fixtures are
      # anonymously pulled from the digest-locked published packages.
      cpu: 4
      memory: 8GB
    triggers:
      push:
        branches:
          - main
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          set -euo pipefail
          DATADOG_EVIDENCE="$(mktemp -d "${TMPDIR:-/tmp}/datadog-evidence.XXXXXX")"
          DATADOG_IMAGES=""
          archive_datadog_evidence() {
            status=$?
            trap - EXIT
            set +e
            tools/run_datadog_parity.sh --archive "$DATADOG_IMAGES" "$DATADOG_EVIDENCE"
            archive_status=$?
            if (( status == 0 && archive_status != 0 )); then
              exit "$archive_status"
            fi
            exit "$status"
          }
          trap archive_datadog_evidence EXIT
          REPORT_REVISION="$(git rev-parse HEAD)"
          # BuildBuddy checks pull requests out at a synthetic merge whose first parent is the PR head.
          if [ "$(git show -s --format=%ce HEAD)" = "ci-runner@buildbuddy.io" ]; then
            REPORT_REVISION="$(git rev-parse HEAD^1)"
          fi
          git checkout --detach "$REPORT_REVISION"
          DATADOG_IMAGES="$(mktemp -d "${TMPDIR:-/tmp}/datadog-images.XXXXXX")"
          # Keep the parity driver's optional local-image interface, with no
          # overrides when using the published fixtures.
          : > "$DATADOG_IMAGES/bazel.flags"
          mapfile -t IMAGE_FLAGS < "$DATADOG_IMAGES/bazel.flags"
          # No revision is stamped here, so these results stay cacheable across
          # commits; only the report run below needs a revision in its receipts.
          # The report suite is excluded rather than run twice.
          bazel test \
            --config=buildbuddy \
            --spawn_strategy=remote,local \
            --build_tests_only \
            --test_tag_filters=-otel-report \
            "${IMAGE_FLAGS[@]}" \
            //...
          # The parity driver owns the independent fresh executions and their
          # retained receipts, plus the manual Rails/Gin isolation and feature
          # suites that wildcard expansion intentionally omits.
          tools/run_datadog_parity.sh "$DATADOG_IMAGES" "$REPORT_REVISION" "$DATADOG_EVIDENCE"
          cp "$DATADOG_EVIDENCE/datadog-report.html" "$BUILDBUDDY_ARTIFACTS_DIRECTORY/datadog-report.html"
          # The report run stays uncached: report/cmd/main.go refuses to assemble
          # from a build event file that does not prove --nocache_test_results,
          # because the report claims its evidence came from a fresh run.
          OTEL_TEST_REVISION="$REPORT_REVISION" bazel test \
            --config=buildbuddy \
            --spawn_strategy=remote,local \
            --nocache_test_results \
            --test_env=OTEL_TEST_REVISION \
            --build_event_json_file=otel-profile.bep.json \
            --nobuild_event_json_file_path_conversion \
            --remote_download_outputs=toplevel \
            "${IMAGE_FLAGS[@]}" \
            //fixtures:otel_report_suite \
            //fixtures:telemetry_lab_suite
          REPORT_BAZEL_CONFIG=buildbuddy \
            REPORT_REPOSITORY=pawelchcki/rules_stests \
            REPORT_REVISION="$REPORT_REVISION" \
            tools/assemble_otel_report.sh
          (cd examples/plugin_agent && \
            bazel test \
              --config=buildbuddy \
              --build_tests_only \
              //...)
          (cd examples/plugin_agent && \
            bazel build --config=buildbuddy //:otel_report_manifest //:telemetry_api_check)
          # Files written here are published as BuildBuddy workflow artifacts.
          cp feature-parity-report.html "$BUILDBUDDY_ARTIFACTS_DIRECTORY/opentelemetry-proof-report.html"
