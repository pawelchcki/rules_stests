actions:
  - name: Full test suite
    container_image: ubuntu-24.04
    resource_requests:
      cpu: 32
      memory: 32GB
    triggers:
      push:
        branches:
          - main
      pull_request:
        branches:
          - "*"
    steps:
      - run: "bazel test --config=buildbuddy --build_tests_only //... //bazel/itest/apps:aiohttp_otel_contract_test //bazel/itest/apps:django_otel_contract_test //bazel/itest/apps:gin_otel_contract_test"
      - run: |
          bazel build --config=buildbuddy --remote_download_outputs=toplevel //corpus:feature_parity_report
          cp bazel-bin/corpus/feature-parity-report.html "$BUILDBUDDY_ARTIFACTS_DIRECTORY/feature-parity-report.html"
