actions:
  - name: Full test suite
    visibility: PUBLIC
    container_image: ubuntu-24.04
    # Keep runner caches and installed tools across PR iterations.
    platform_properties:
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    resource_requests:
      # Bazel actions execute on the self-hosted RBE fleet. Fixtures are
      # anonymously pulled from the digest-locked published packages.
      cpu: 4
      memory: 8GB
    triggers:
      pull_request:
        branches:
          - "*"
    steps:
      - run: bash tools/run_ci.sh pr

  - name: Full test suite (all variants)
    visibility: PUBLIC
    container_image: ubuntu-24.04
    platform_properties:
      remote-snapshot-save-policy: always
      snapshot-read-policy: newest
    resource_requests:
      cpu: 4
      memory: 8GB
    triggers:
      push:
        branches:
          - main
    steps:
      - run: bash tools/run_ci.sh full
