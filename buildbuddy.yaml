actions:
  - name: Full test suite
    visibility: PUBLIC
    container_image: ubuntu-24.04
    resource_requests:
      # Bazel actions execute on the self-hosted RBE fleet; the runner also
      # builds the two unpublished Datadog OCI fixtures used as inputs.
      cpu: 4
      memory: 8GB
    triggers:
      push:
        branches:
          - main
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          set -euo pipefail
          REPORT_REVISION="$(git rev-parse HEAD)"
          # BuildBuddy checks pull requests out at a synthetic merge whose first parent is the PR head.
          if [ "$(git show -s --format=%ce HEAD)" = "ci-runner@buildbuddy.io" ]; then
            REPORT_REVISION="$(git rev-parse HEAD^1)"
          fi
          git checkout --detach "$REPORT_REVISION"
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          DATADOG_IMAGES="$(mktemp -d "${TMPDIR:-/tmp}/datadog-images.XXXXXX")"
          sudo env CONTAINER_BUILD_NETWORK=host \
            tools/build_datadog_fixtures.sh "$DATADOG_IMAGES"
          mapfile -t IMAGE_FLAGS < "$DATADOG_IMAGES/bazel.flags"
          # No revision is stamped here, so these results stay cacheable across
          # commits; only the report run below needs a revision in its receipts.
          # The report suite is excluded rather than run twice.
          bazel test \
            --config=buildbuddy \
            --spawn_strategy=remote,local \
            --build_tests_only \
            --test_tag_filters=-otel-report \
            "${IMAGE_FLAGS[@]}" \
            //...
          # The report run stays uncached: report/cmd/main.go refuses to assemble
          # from a build event file that does not prove --nocache_test_results,
          # because the report claims its evidence came from a fresh run.
          OTEL_TEST_REVISION="$REPORT_REVISION" bazel test \
            --config=buildbuddy \
            --spawn_strategy=remote,local \
            --nocache_test_results \
            --test_env=OTEL_TEST_REVISION \
            --build_event_json_file=otel-profile.bep.json \
            --nobuild_event_json_file_path_conversion \
            --remote_download_outputs=toplevel \
            "${IMAGE_FLAGS[@]}" \
            //fixtures:otel_report_suite
          REPORT_BAZEL_CONFIG=buildbuddy \
            REPORT_REPOSITORY=pawelchcki/rules_stests \
            REPORT_REVISION="$REPORT_REVISION" \
            tools/assemble_otel_report.sh
          (cd examples/plugin_agent && \
            bazel test \
              --config=buildbuddy \
              --build_tests_only \
              //...)
          (cd examples/plugin_agent && \
            bazel build --config=buildbuddy //:otel_report_manifest)
          # Files written here are published as BuildBuddy workflow artifacts.
          cp feature-parity-report.html "$BUILDBUDDY_ARTIFACTS_DIRECTORY/opentelemetry-proof-report.html"
