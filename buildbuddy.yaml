actions:
  - name: Full test suite
    container_image: ubuntu-24.04
    resource_requests:
      cpu: 32
      memory: 32GB
    triggers:
      push:
        branches:
          - main
      pull_request:
        branches:
          - "*"
    steps:
      - run: "OTEL_TEST_REVISION=$(git rev-parse HEAD) bazel test --config=buildbuddy --build_tests_only --test_env=OTEL_TEST_REVISION //... //bazel/itest/apps:gin_otel_contract_test"
