actions:
  - name: Full test suite
    container_image: ubuntu-24.04
    resource_requests:
      cpu: 32
      memory: 32GB
    triggers:
      push:
        branches:
          - main
      pull_request:
        branches:
          - "*"
    steps:
      - run: "bazel test --config=buildbuddy --build_tests_only //bazel/... //bazel/itest:aiohttp_otel_contract_test //bazel/itest:django_otel_contract_test"
